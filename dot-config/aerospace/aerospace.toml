# Only settings that deviate from AeroSpace's bundled default-config.toml live here.
# Everything else (gaps, layout, normalization, key-mapping, mouse-follows-focus, ...)
# falls back to the default. Binding tables ([mode.*.binding]) are the one exception:
# they do NOT fall back to defaults, so they must be spelled out in full below.
# See: https://nikitabobko.github.io/AeroSpace/guide#default-config

config-version = 2
start-at-login = true

# Keeps I/O/P/U visible in the menu bar even with no windows open.
# NOTE: does NOT reorder them (that reorder feature, PR #1926, isn't released yet
# as of 0.21.3-Beta) -- menu bar stays alphabetical (I O P U) regardless of this order.
persistent-workspaces = ['I', 'O', 'P', 'U']

# 'main' mode must always be present
[mode.main.binding]

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspace mnemonics: one right-hand block (u i o p), right above the h j k l
# focus keys, so alt (left hand) + workspace (right hand) never chords same-handed.
# I = Internet (Brave), O = Outlook, U = (Teams) commUnication, P = Prompt (Ghostty)
alt-i = 'workspace I'
alt-o = 'workspace O'
alt-u = 'workspace U'
alt-p = 'workspace P'

alt-shift-i = 'move-node-to-workspace I'
alt-shift-o = 'move-node-to-workspace O'
alt-shift-u = 'move-node-to-workspace U'
alt-shift-p = 'move-node-to-workspace P'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[workspace-to-monitor-force-assignment]
I = 'main'      # Browser
O = 'secondary' # Outlook
U = 'main'      # Teams
P = 'main'      # Console (ghostty)

# Stack (accordion) instead of tile side by side, so alt-h/alt-l cycle windows
[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = ['move-node-to-workspace I', 'layout accordion horizontal vertical']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace P'

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace O'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace U', 'layout accordion horizontal vertical']
