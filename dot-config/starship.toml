add_newline = false

format = """$directory $git_branch$git_status
$character"""

[directory]
style = "bold bright-blue"
format = "[$path]($style)"
truncation_length = 0

[git_branch]
style = "bright-black"
format = "[$branch]($style)"

[git_status]
style = "yellow"
format = "[$all_status$ahead_behind]($style)"
ahead = "↑${count}"
behind = "↓${count}"
ignore_submodules = true

[character]
success_symbol = "[❯](bold magenta)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold magenta)"
