onboarding = false
# ── Terminal ────────────────────────────────────────────
[terminal]
default_shell = "/opt/homebrew/bin/fish"

[theme]
name = "gruvbox"
auto_switch = false

[ui.toast]
delivery = "system"

# ── Keys ────────────────────────────────────────────────
[keys]
prefix = "ctrl+space"
# tmux-style back-and-forth: jump to the last focused pane, across workspaces/tabs.
last_pane = "prefix+tab"
# Disable the built-in workspace picker; replaced by our own fzf popup below.
workspace_picker = ""

# fzf picker: select or create a workspace from directories under a base dir.
# Opens as a popup; closes when the command exits.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/herdr-workspace-picker.sh ~/dev"
width = "60%"
height = "60%"
description = "Open/create workspace by directory"

# fzf popup: switch focus to an existing workspace by label.
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "~/.config/herdr/herdr-workspace-switcher.sh"
width = "60%"
height = "60%"
description = "Switch workspace"

# fzf popup: switch focus to an existing agent pane.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "~/.config/herdr/herdr-agent-switcher.sh"
width = "60%"
height = "60%"
description = "Switch agent"
