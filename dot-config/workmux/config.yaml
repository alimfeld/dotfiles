nerdfont: true

agent: pi

agents:
  pi-spec:
    type: pi
    args: [--model, claude-opus-5, --thinking, high]
  pi-review:
    type: pi
    args: [--model, claude-opus-5, --thinking, high]
  pi-create:
    type: pi
    args: [--model, claude-opus-5, --thinking, medium]
  pi-update:
    type: pi
    args: [--model, claude-sonnet-5, --thinking, medium]

panes:
  - command: <agent>
    focus: true
  - split: horizontal
