# ── Server ───────────────────────────────────────────────
set -s focus-events on                  # pass through focus events to applications running in tmux
set -s extended-keys on                 # report modifier keys (CSI u) to applications
set -s extended-keys-format csi-u       # use CSI u encoding for extended keys
set -s theme terminal                   # tmux 3.8+: use terminal colours instead of builtin light/dark theme

# ── Session & windows ────────────────────────────────────
set -g base-index 1                     # start numbering windows from one (default is zero)
set -g pane-base-index 1                # start numbering panes from one (default is zero)
set -g history-limit 10000              # scrollback lines kept per pane
set -g status-position top              # status at the top of the screen
set -g status-left-length 40            # workmux/sesh session names run longer than tmux's default 10
set -g status-right ""                  # no clock/host/pane-title - session name is the only signal that matters
set -g detach-on-destroy off            # don't exit from tmux when closing a session

# ── Prefix ───────────────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# ── Panes ────────────────────────────────────────────────
bind -N "Split: new pane right (60%)" v split-window -h -l 60%
bind -N "Split: new pane left (40%)" V split-window -h -b -l 40%

# ── Tools ────────────────────────────────────────────────
bind -N "Open scrollback in editor" C-e capture-pane -S - \; new-window "tmux save-buffer - \\; delete-buffer | $EDITOR -"
bind -N "workmux dashboard" C-s display-popup -h 80% -w 80% -E "workmux dashboard"
bind -N "workmux sidebar" C-t run-shell "workmux sidebar"
bind -N "sesh: pick session" s run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# ── Pane navigation ──────────────────────────────────────
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator (Disable Wrapping)
%hidden vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n C-h if-shell "$is_vim" { send-keys C-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind -n C-j if-shell "$is_vim" { send-keys C-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind -n C-k if-shell "$is_vim" { send-keys C-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind -n C-l if-shell "$is_vim" { send-keys C-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }
bind -N "Clear screen" C-l send-keys C-l

bind -T copy-mode-vi C-h if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind -T copy-mode-vi C-j if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind -T copy-mode-vi C-k if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind -T copy-mode-vi C-l if-shell -F '#{pane_at_right}'  {} { select-pane -R }

# ── Local ────────────────────────────────────────────────
source-file -q ~/.config/local/tmux.conf   # machine-local overrides, if any
