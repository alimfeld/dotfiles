# ── Server ───────────────────────────────────────────────
set -s escape-time 0                    # don't wait after escape is input
set -s focus-events on                  # pass through focus events to applications running in tmux
set -s extended-keys on                 # report modifier keys (CSI u) to applications
set -s extended-keys-format csi-u       # use CSI u encoding for extended keys

# ── Session & windows ────────────────────────────────────
set -g default-shell /opt/homebrew/bin/fish
set -g base-index 1                     # start numbering windows from one (default is zero)
setw -g pane-base-index 1               # start numbering panes from one (default is zero)
set -g mouse on                         # add mouse support (select & resize panes, copy text, change window)
set -g status-position top              # status at the top of the screen

# ── Prefix ───────────────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# ── Panes ────────────────────────────────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# ── Tools ────────────────────────────────────────────────
bind f display-popup -E "tmux-sessionizer"
bind Space display-popup -h 30 -w 100 -E "workmux dashboard"
bind Tab run-shell "workmux sidebar"

# ── Copy mode ────────────────────────────────────────────
setw -g mode-keys vi                                         # vi keys in copy mode and view mode (pager)
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection           # also on Space; rectangle-toggle stays on C-v
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel # unbound by default in vi mode

# ── Pane navigation ──────────────────────────────────────
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator (Disable Wrapping)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n C-h if-shell "$is_vim" { send-keys C-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind -n C-j if-shell "$is_vim" { send-keys C-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind -n C-k if-shell "$is_vim" { send-keys C-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind -n C-l if-shell "$is_vim" { send-keys C-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

bind -T copy-mode-vi C-h if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind -T copy-mode-vi C-j if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind -T copy-mode-vi C-k if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind -T copy-mode-vi C-l if-shell -F '#{pane_at_right}'  {} { select-pane -R }
